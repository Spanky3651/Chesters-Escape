name = "chester-game"
main = "src/index.js"
compatibility_date = "2025-09-01"

# One Durable Object holds the game so every roll is applied in order.
[[durable_objects.bindings]]
name = "GAME"
class_name = "Game"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Game"]

[vars]
# The game page. Sign-in sends players back here.
GAME_PAGE = "https://spanky3651.github.io/Chesters-Escape/"
# Pages allowed to call this server (comma separated).
ALLOWED_ORIGINS = "https://spanky3651.github.io"
# Discord user IDs that get the host tools (comma separated).
HOSTS = "909550896571113492"
# The game starts invite-only. People who sign in land on the host's waiting list
# (Host tools, Who can play). Optional: Discord IDs let in from the start (comma separated).
TESTERS = ""
# "1" posts start, day and end messages to each clan's webhook. A clan can override it with announce.
ANNOUNCE_DAYS = "0"

# One game per clan Discord server. Members of a server can sign in to that clan's game;
# people in both servers get a switcher. Settings per clan:
#   name     shown on the switcher
#   order    position on the switcher and the game picker (1 first)
#   guild    the Discord server ID (empty lets anyone sign in)
#   game     the name the game is stored under. GenX keeps "main", the game that's already running.
#   theme    theme for a brand-new game (cemetery, christmas, thanksgiving, taco-thanksgiving, taco-christmas)
#   webhook  name of the secret holding that clan's Discord channel webhook
#   hosts    optional extra host Discord IDs for this clan only (comma separated)
[vars.CLANS.genx]
name = "GenX"
order = 1
guild = "933398740008587396"
game = "main"
theme = "cemetery"
webhook = "DISCORD_WEBHOOK_URL"

[vars.CLANS.beaters]
name = "Beaters"
order = 2
guild = "1420030867908329482"
game = "beaters"
theme = "taco-thanksgiving"
webhook = "DISCORD_WEBHOOK_URL_BEATERS"

# Secrets (set with: npx wrangler secret put NAME)
#   DISCORD_CLIENT_ID      from the Discord developer portal, OAuth2 page
#   DISCORD_CLIENT_SECRET  same page
#   SESSION_SECRET         any long random string
#   DISCORD_WEBHOOK_URL    optional, GenX's game channel webhook for posting results
#   DISCORD_WEBHOOK_URL_BEATERS  optional, the same for the Beaters server
#   VAPID_PUBLIC_KEY       optional, push notifications for hosts (see the key command in the setup notes)
#   VAPID_PRIVATE_KEY      optional, the matching private key
